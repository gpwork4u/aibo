services:
  db:
    build:
      context: ../docker/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: aibo
      POSTGRES_USER: aibo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aibo_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibo"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./src
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://aibo:${DB_PASSWORD:-aibo_dev_password}@db:5432/aibo?sslmode=disable
      SERVER_PORT: "8080"
      AIBO_ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
